<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商用厨房空间编辑器</title>
<style>
:root{--blue:#4e82bb;--blue2:#355e8d;--ink:#1c2f45;--muted:#72839a;--line:#c9d8e8;--bg:#f5f8fb;--warn:#c57a22;--danger:#c54b44}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Microsoft YaHei",Arial,sans-serif}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:18px;box-shadow:0 1px 5px #3154770d}.brand{font-weight:800;font-size:17px;white-space:nowrap}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}.toolset{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--blue2);background:var(--blue);color:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit;box-shadow:inset 0 1px #ffffff55}.btn:hover{background:#3d70aa}.btn.ghost{background:#fff;color:var(--blue2);border-color:var(--line);box-shadow:none}.btn.danger{background:#fff;color:#b73f39;border-color:#e4b4b0}.project{margin-left:auto;display:flex;align-items:center;gap:7px;color:#31445a;white-space:nowrap}.project input{width:146px;border:0;border-bottom:1px solid #9aacbf;padding:5px 2px;font-weight:700;color:var(--ink);outline:0;background:transparent}.shell{max-width:1520px;margin:auto;padding:16px 20px 20px}.shelf{background:#fff;border:2px solid var(--blue2);border-radius:5px;min-height:126px;padding:10px 12px;display:grid;grid-template-columns:128px 1fr 58px;gap:12px;align-items:stretch;box-shadow:0 2px 5px #31547712}.shelf-label{display:flex;align-items:center;justify-content:center;text-align:center;border-right:1px solid var(--line);color:var(--blue2);font-size:16px;font-weight:700;line-height:1.25}.shelf-label small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:5px}.items{display:flex;gap:9px;align-items:center;overflow:hidden}.module{width:108px;min-width:108px;height:94px;border:1px solid #c3d2e1;border-radius:8px;background:linear-gradient(#fff,#f4f8fc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:grab;user-select:none;transition:.15s}.module:hover{border-color:var(--blue);box-shadow:0 3px 10px #31547722;transform:translateY(-2px)}.module:active{cursor:grabbing}.ico{width:46px;height:32px;border-radius:5px;background:#5b8dc5;border:2px solid #386694;position:relative}.ico.round{border-radius:50%}.ico.heat{background:#dc6b4c}.ico.heat:after{content:"";position:absolute;inset:7px;border:1px solid #ffe1b9;border-radius:50%}.ico.sink{background:#70a7b4;border-radius:50% 50% 42% 42%}.ico.fridge:after{content:"";position:absolute;top:2px;bottom:2px;left:50%;border-left:1px solid #d3e7fa}.module b{font-size:12px;font-weight:700;white-space:nowrap}.module small{font-size:10px;color:var(--muted)}.pager{display:flex;flex-direction:column;justify-content:center;gap:8px}.page{border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--blue2);font-size:18px;cursor:pointer;height:35px}.page:disabled{opacity:.35;cursor:default}.morebar{display:flex;justify-content:center;margin-top:8px}.morebar button{font-size:12px}.workspace{margin-top:12px;display:grid;grid-template-columns:1fr 260px;gap:12px}.canvas-frame{background:#fff;border:2px solid var(--blue2);border-radius:4px;min-height:600px;padding:22px;overflow:auto;box-shadow:0 2px 5px #31547712}.canvas{position:relative;margin:auto;background:#fff;background-image:linear-gradient(#d5e0eb 1px,transparent 1px),linear-gradient(90deg,#d5e0eb 1px,transparent 1px),linear-gradient(#a9bfd4 1px,transparent 1px),linear-gradient(90deg,#a9bfd4 1px,transparent 1px);box-shadow:0 1px 8px #1737571c}.base{position:absolute;z-index:1;pointer-events:none}.wall{background:#33465c}.wall.half{background:repeating-linear-gradient(135deg,#a16a43 0 5px,#d09a73 5px 10px)}.door{background:#fff;border:2px solid #a46a31}.window{background:#bce2f5;border:2px solid #4188b5}.utility{position:absolute;z-index:2;width:18px;height:18px;border:2px solid white;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:bold;pointer-events:none}.device{position:absolute;z-index:5;border:2px solid #fff;border-radius:5px;color:#fff;box-shadow:0 2px 6px #18375255;cursor:move;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;font-size:12px;font-weight:700;line-height:1.2;user-select:none}.device small{display:block;font-size:10px;font-weight:400;margin-top:2px}.device.selected{outline:3px solid #f2b33f;outline-offset:2px;z-index:8}.side{background:#fff;border:1px solid var(--line);border-radius:7px;padding:13px;height:max-content}.side h2{font-size:14px;margin:0 0 9px}.side p{margin:0 0 9px;font-size:12px;color:var(--muted)}.result{border-top:1px solid #e5edf5;padding-top:8px;font-size:12px;max-height:295px;overflow:auto}.result p{margin:0 0 7px}.ok{color:#168044}.warn{color:#ad6716}.bad{color:#bf403c}.legend{display:flex;gap:10px;flex-wrap:wrap;color:#687b90;font-size:12px;margin-top:10px}.legend i{display:inline-block;width:14px;height:14px;background:#33465c;vertical-align:-3px;margin-right:4px}.legend i.half{background:repeating-linear-gradient(135deg,#a16a43 0 3px,#d09a73 3px 6px)}.legend i.dot{background:#5b8dc5;border-radius:50%;border:2px solid #fff;outline:1px solid #5b8dc5}.modal{position:fixed;inset:0;background:#10243b75;display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.modal-box{background:#fff;width:min(600px,92vw);max-height:75vh;overflow:auto;border-radius:10px;padding:18px;box-shadow:0 15px 50px #0004}.modal-box h2{margin:0 0 12px}.history{display:grid;gap:8px}.hist{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);padding:9px;border-radius:6px;font-size:12px}.hint{font-size:11px;color:var(--muted)}@media(max-width:960px){header{height:auto;min-height:64px;padding:10px;flex-wrap:wrap}.project{margin-left:0}.workspace{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:15px}.shelf{grid-template-columns:100px 1fr 44px}.shelf-label{font-size:13px}.shell{padding:10px}.canvas-frame{min-height:520px}}@media(max-width:620px){.module{width:94px;min-width:94px}.shelf{grid-template-columns:76px 1fr 38px;padding:7px;gap:7px}.shelf-label{font-size:12px}.side{display:block}.toolset{gap:4px}.btn{padding:6px 8px;font-size:12px}}</style></head>
<body><header><div class="brand">厨房空间编辑器<small>受约束的商用厨房布局</small></div><div class="toolset"><button class="btn" id="import">导入</button><button class="btn" id="export">导出</button><button class="btn ghost" id="validate">校验布局</button><button class="btn danger" id="delete">删除选中</button><button class="btn ghost" id="historyBtn">历史冷藏柜</button></div><label class="project">项目名称：<input id="projectName" value="新建餐饮项目"></label></header>
<main class="shell"><section class="shelf"><div class="shelf-label">可拖拽<br>设备模块<small>标准商用尺寸</small></div><div class="items" id="items"></div><div class="pager"><button class="page" id="prev">‹</button><button class="page" id="next">›</button></div></section><div class="morebar"><button class="btn ghost" id="expand">展开全部设备库 ▾</button></div>
<section class="workspace"><div><div class="canvas-frame"><div class="canvas" id="canvas"></div></div><div class="legend"><span><i></i>承重/全墙</span><span><i class="half"></i>非承重半墙（可拆）</span><span><i class="dot"></i>水 / 电 / 燃气 / 排烟接口</span><span>小网格：0.5m</span></div></div><aside class="side"><h2>方案检查</h2><p id="status">将上方厨具模块拖到图纸区域。</p><div class="result" id="result"><p>基底墙体、门窗和接口均锁定；设备只允许在可用区域摆放。</p></div><hr style="border:0;border-top:1px solid #e5edf5;margin:12px 0"><h2>使用提示</h2><p>点击设备后可拖动或删除；标准尺寸为常见商用设备参考值，采购前请以实际厂家图纸为准。</p></aside></section></main>
<div class="modal" id="modal"><div class="modal-box"><h2>历史冷藏柜</h2><p class="hint">保存当前方案后，可随时恢复。仅保存在本浏览器。</p><div class="history" id="history"></div><button class="btn ghost" id="closeModal">关闭</button></div></div><input id="file" type="file" accept=".json,application/json" hidden>
<script>
(()=>{const M=100,G=50,$=id=>document.getElementById(id),canvas=$("canvas");let selected=null,drag=null,page=0,expanded=false,layout={version:3,placements:[]};const base={width:10,height:7,elements:[{type:"wall",x:0,y:0,width:10,height:.2,structure:"bearing",form:"full"},{type:"wall",x:0,y:6.8,width:10,height:.2,structure:"bearing",form:"full"},{type:"wall",x:0,y:0,width:.2,height:7,structure:"bearing",form:"full"},{type:"wall",x:9.8,y:0,width:.2,height:7,structure:"bearing",form:"full"},{type:"wall",x:3.4,y:1.2,width:.2,height:2.4,structure:"nonBearing",form:"half",demolitionAllowed:true},{type:"door",x:4.1,y:6.78,width:1.2,height:.22},{type:"window",x:9.78,y:1.6,width:.22,height:1.5}],utilityPoints:[{type:"power",x:1,y:1},{type:"water",x:1,y:5.8},{type:"drain",x:1.2,y:5.8},{type:"gas",x:7.8,y:1},{type:"exhaust",x:7.8,y:.5}]};const lib=[
{id:"prep",name:"操作台",width:1.8,height:.8,color:"#526a82",cat:"备餐",needs:[],front:1,ico:""},
{id:"shelf",name:"四层货架",width:1.2,height:.5,color:"#5879a3",cat:"储存",needs:[],front:.9,ico:""},
{id:"singleSink",name:"单星水池",width:.8,height:.7,color:"#6299aa",cat:"洗消",needs:["water","drain"],front:1,ico:"sink"},
{id:"doubleSink",name:"双星水池",width:1.5,height:.7,color:"#6299aa",cat:"洗消",needs:["water","drain"],front:1,ico:"sink"},
{id:"uprightFridge",name:"立式冷藏柜",width:.75,height:.8,color:"#477eb7",cat:"冷藏",needs:["power"],front:1.2,ico:"fridge"},
{id:"underFridge",name:"卧式冷柜",width:1.8,height:.8,color:"#477eb7",cat:"冷藏",needs:["power"],front:1.1,ico:"fridge"},
{id:"fourBurner",name:"四头燃气炉",width:1.2,height:.8,color:"#d06a4b",cat:"热厨",needs:["gas","exhaust"],front:1.2,ico:"heat"},
{id:"wok",name:"双眼大锅灶",width:1.8,height:1,color:"#d06a4b",cat:"热厨",needs:["gas","water","exhaust"],front:1.3,ico:"heat"},
{id:"fryer",name:"双缸油炸炉",width:.8,height:.8,color:"#c76038",cat:"热厨",needs:["power","exhaust"],front:1.2,ico:"heat"},
{id:"combi",name:"六盘蒸烤箱",width:.9,height:.9,color:"#7656a5",cat:"热厨",needs:["power","water","drain"],front:1.3,ico:""},
{id:"dishwasher",name:"揭盖洗碗机",width:.7,height:.7,color:"#52949c",cat:"洗消",needs:["power","water","drain"],front:1.1,ico:"sink"},
{id:"hood",name:"排烟罩",width:2,height:1,color:"#536b80",cat:"排烟",needs:["exhaust"],front:0,ico:""},
{id:"rice",name:"电饭煲台",width:.8,height:.7,color:"#806440",cat:"备餐",needs:["power"],front:1,ico:"round"},
{id:"freezer",name:"卧式冰柜",width:1.5,height:.7,color:"#477eb7",cat:"冷藏",needs:["power"],front:1.1,ico:"fridge"},
{id:"warming",name:"保温台",width:1.2,height:.7,color:"#b47439",cat:"出餐",needs:["power"],front:1,ico:"heat"},
{id:"pass",name:"出餐台",width:1.5,height:.6,color:"#526a82",cat:"出餐",needs:[],front:1,ico:""}];
const get=id=>lib.find(x=>x.id===id),rr=(x,y,w,h)=>({x,y,w,h}),hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function renderBase(){canvas.innerHTML="";canvas.style.width=base.width*M+"px";canvas.style.height=base.height*M+"px";canvas.style.backgroundSize=G+"px "+G+"px, "+G+"px "+G+"px, "+M+"px "+M+"px, "+M+"px "+M+"px";base.elements.forEach(e=>{let d=document.createElement("div");d.className="base "+e.type+(e.form==="half"?" half":"");d.title=e.type==="wall"?(e.structure==="bearing"?"承重全墙":e.form==="half"?"非承重半墙（可拆）":"非承重全墙"):"锁定"+e.type;d.style.cssText="left:"+e.x*M+"px;top:"+e.y*M+"px;width:"+e.width*M+"px;height:"+e.height*M+"px";canvas.append(d)});base.utilityPoints.forEach(u=>{let d=document.createElement("div");d.className="utility";d.textContent={power:"电",water:"水",drain:"排",gas:"气",exhaust:"烟"}[u.type];d.style.cssText="left:"+u.x*M+"px;top:"+u.y*M+"px;background:"+({power:"#7656a5",water:"#2185bd",drain:"#249b8a",gas:"#d64d42",exhaust:"#526a82"}[u.type]);d.title=u.type+" 接口";canvas.append(d)});renderDevices()}
function renderDevices(){canvas.querySelectorAll(".device").forEach(x=>x.remove());layout.placements.forEach(p=>{let c=get(p.componentId);if(!c)return;let d=document.createElement("div");d.className="device"+(selected===p.instanceId?" selected":"");d.style.cssText="left:"+p.x*M+"px;top:"+p.y*M+"px;width:"+c.width*M+"px;height:"+c.height*M+"px;background:"+c.color;d.innerHTML="<div>"+c.name+"<small>"+c.width+"m × "+c.height+"m</small></div>";d.onpointerdown=e=>start(e,p,c);canvas.append(d)})}
function renderShelf(){let list=expanded?lib:lib.slice(page*6,page*6+6),box=$("items");box.innerHTML="";box.style.flexWrap=expanded?"wrap":"nowrap";box.style.alignContent=expanded?"flex-start":"center";list.forEach(c=>{let d=document.createElement("div");d.className="module";d.draggable=true;d.innerHTML="<i class='ico "+c.ico+"'></i><b>"+c.name+"</b><small>"+c.width+"m × "+c.height+"m</small>";d.ondragstart=e=>e.dataTransfer.setData("component",c.id);box.append(d)});$("prev").disabled=expanded||page===0;$("next").disabled=expanded||(page+1)*6>=lib.length;$("expand").textContent=expanded?"收起设备库 ▴":"展开全部设备库 ▾"}
function place(e,c,ox=0,oy=0){let r=canvas.getBoundingClientRect(),x=Math.max(0,Math.min(Math.round((e.clientX-r.left-ox)/G)*.5,base.width-c.width)),y=Math.max(0,Math.min(Math.round((e.clientY-r.top-oy)/G)*.5,base.height-c.height));return{x,y}}
function start(e,p,c){e.preventDefault();let r=canvas.getBoundingClientRect();selected=p.instanceId;drag={p,c,ox:e.clientX-r.left-p.x*M,oy:e.clientY-r.top-p.y*M};renderDevices()}
function validate(){let out=[],all=layout.placements.map(p=>({...p,c:get(p.componentId)}));all.forEach((p,i)=>{let a=rr(p.x,p.y,p.c.width,p.c.height);base.elements.filter(e=>["wall","door","window"].includes(e.type)).forEach(e=>{if(hit(a,rr(e.x,e.y,e.width,e.height)))out.push(["bad",p.c.name+" 与 "+(e.type==="wall"?"墙体":e.type==="door"?"门洞":"窗洞")+"重叠"])});all.slice(i+1).forEach(q=>{if(hit(a,rr(q.x,q.y,q.c.width,q.c.height)))out.push(["bad",p.c.name+" 与 "+q.c.name+" 重叠"])});(p.c.needs||[]).forEach(n=>{let pts=base.utilityPoints.filter(u=>u.type===n),cx=p.x+p.c.width/2,cy=p.y+p.c.height/2;if(!pts.length)out.push(["warn",p.c.name+" 未配置 "+n+" 接口"]);else if(!pts.some(u=>Math.hypot(u.x-cx,u.y-cy)<=3))out.push(["warn",p.c.name+" 距 "+n+" 接口超过 3m，请复核"])});if(p.c.front&&p.y+p.c.height+p.c.front>base.height)out.push(["warn",p.c.name+" 前方操作净距不足 "+p.c.front+"m"])});$("result").innerHTML=out.length?out.map(x=>"<p class='"+x[0]+"'>● "+x[1]+"</p>").join(""):"<p class='ok'>✓ 未发现重叠、门窗/墙体占用或接口缺失。请结合消防、排烟与厂家安装图复核。</p>";$("status").textContent=out.length?"发现 "+out.length+" 项待处理":"校验通过"}
function saveHistory(){let all=JSON.parse(localStorage.getItem("kitchen-history")||"[]");all.unshift({name:$("projectName").value,time:new Date().toLocaleString(),layout:JSON.parse(JSON.stringify(layout))});localStorage.setItem("kitchen-history",JSON.stringify(all.slice(0,12)));showHistory()}
function showHistory(){$("modal").classList.add("show");let all=JSON.parse(localStorage.getItem("kitchen-history")||"[]");$("history").innerHTML=all.length?all.map((h,i)=>"<div class='hist'><span><b>"+h.name+"</b><br><span class='hint'>"+h.time+" · "+h.layout.placements.length+" 个设备</span></span><button class='btn ghost' data-i='"+i+"'>恢复</button></div>").join(""):"<p class='hint'>尚无已保存方案。</p>";document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{layout=all[+b.dataset.i].layout;selected=null;renderDevices();$("modal").classList.remove("show");$("status").textContent="已恢复历史方案"})}
canvas.ondragover=e=>e.preventDefault();canvas.ondrop=e=>{e.preventDefault();let c=get(e.dataTransfer.getData("component"));if(!c)return;let p=place(e,c,c.width*M/2,c.height*M/2),id="item_"+Date.now();layout.placements.push({instanceId:id,componentId:c.id,x:p.x,y:p.y});selected=id;renderDevices();$("status").textContent="已添加 "+c.name};window.onpointermove=e=>{if(!drag)return;let p=place(e,drag.c,drag.ox,drag.oy);drag.p.x=p.x;drag.p.y=p.y;renderDevices()};window.onpointerup=()=>drag=null;canvas.onpointerdown=e=>{if(e.target===canvas){selected=null;renderDevices()}};
$("prev").onclick=()=>{page--;renderShelf()};$("next").onclick=()=>{page++;renderShelf()};$("expand").onclick=()=>{expanded=!expanded;renderShelf()};$("delete").onclick=()=>{if(!selected){$("status").textContent="请先选择设备";return}layout.placements=layout.placements.filter(p=>p.instanceId!==selected);selected=null;renderDevices();$("status").textContent="已删除设备"};$("validate").onclick=validate;$("historyBtn").onclick=saveHistory;$("closeModal").onclick=()=>{$("modal").classList.remove("show")};$("export").onclick=()=>{let blob=new Blob([JSON.stringify({projectName:$("projectName").value,layout},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=($("projectName").value||"厨房方案")+".json";a.click();URL.revokeObjectURL(a.href)};$("import").onclick=()=>$("file").click();$("file").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);layout=v.layout||v;selected=null;if(v.projectName)$("projectName").value=v.projectName;renderDevices();$("status").textContent="已导入方案"}catch{x=0;$("status").textContent="导入文件格式无效"}};r.readAsText(f)};renderShelf();renderBase()})();</script></body></html>
