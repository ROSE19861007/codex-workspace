<script>
document.addEventListener("readystatechange", function saveOriginalImport() {
  if (document.readyState === "interactive") {
    window.__kitchenJsonImport = document.getElementById("file").onchange;
  }
});
document.addEventListener("DOMContentLoaded", function () {
  const canvas = document.getElementById("canvas");
  const fileInput = document.getElementById("file");
  const importButton = document.getElementById("import");
  const status = document.getElementById("status");
  const clearButton = importButton.nextElementSibling;
  const jsonImport = window.__kitchenJsonImport;
  let grid = canvas.querySelector(".grid-layer");
  const sampleCanvasSize = { width: canvas.style.width, height: canvas.style.height };
  let svgUrl = null;
  let choosingOrigin = false;
  window.__gridOrigin = { x: 0, y: 0 };
  const originButton = document.createElement("button");
  originButton.type = "button";
  originButton.className = "btn ghost";
  originButton.textContent = "设置网格原点";
  originButton.disabled = true;
  clearButton.insertAdjacentElement("afterend", originButton);

  function ensureGrid() {
    grid = canvas.querySelector(".grid-layer");
    if (!grid) {
      grid = document.createElement("div");
      grid.className = "grid-layer";
      canvas.prepend(grid);
    }
    grid.style.backgroundSize = "25px 25px, 25px 25px, 100px 100px, 100px 100px";
    const origin = window.__gridOrigin;
    const position = (origin.x * 100) + "px " + (origin.y * 100) + "px";
    grid.style.backgroundPosition = [position, position, position, position].join(", ");
    return grid;
  }

  ensureGrid();

  function setGridOrigin(point) {
    window.__gridOrigin = { x: point.x, y: point.y };
    ensureGrid();
  }

  function knownPlanOrigin(text, size) {
    const root = text.match(/<svg\b[^>]*>/i);
    const match = root && root[0].match(/\bviewBox\s*=\s*['"]([^'"]+)['"]/i);
    if (!match || !size) return null;
    const values = match[1].trim().split(/[\s,]+/).map(Number);
    const expected = [4208.72, -10856.85, 8434.59, 8529.41];
    if (values.length !== 4 || values.some(function (value, index) {
      return !Number.isFinite(value) || Math.abs(value - expected[index]) > .02;
    }) || Math.abs(size.width - 8.6204) > .001 || Math.abs(size.height - 8.71732) > .001) return null;
    return {
      x: (5384.78 - values[0]) * size.width / values[2],
      y: (-7208.52 - values[1]) * size.height / values[3]
    };
  }

  function sizeFromSvg(text) {
    const root = text.match(/<svg\b[^>]*>/i);
    if (!root) return null;
    const attribute = function (name) {
      const match = root[0].match(new RegExp("\\b" + name + "\\s*=\\s*['\"]([^'\"]+)['\"]", "i"));
      return match ? match[1].trim() : null;
    };
    const width = attribute("width");
    const height = attribute("height");
    const units = attribute("data-units");
    if (!width || !height || !(units === "mm" || /mm$/i.test(width) && /mm$/i.test(height))) return null;
    const widthMm = Number.parseFloat(width);
    const heightMm = Number.parseFloat(height);
    if (!Number.isFinite(widthMm) || !Number.isFinite(heightMm) || widthMm <= 0 || heightMm <= 0) return null;
    return { width: widthMm / 1000, height: heightMm / 1000 };
  }

  function wallLinesFromSvg(text, size) {
    const root = text.match(/<svg\b[^>]*>/i);
    if (!root || !size) return [];
    const viewBox = root[0].match(/\bviewBox\s*=\s*['"]([^'"]+)['"]/i);
    if (!viewBox) return [];
    const values = viewBox[1].trim().split(/[\s,]+/).map(Number);
    if (values.length !== 4 || values.some(function (value) { return !Number.isFinite(value); })) return [];
    const minX = values[0], minY = values[1], viewWidth = values[2], viewHeight = values[3];
    if (!(viewWidth > 0 && viewHeight > 0)) return [];
    const stroke = text.match(/stroke-width\s*[:=]\s*['"]?([\d.]+)/i);
    const halfWidth = stroke ? Number(stroke[1]) * size.width / viewWidth / 2 : 0;
    const lines = [];
    const paths = text.match(/<path\b[^>]*>/gi) || [];
    paths.forEach(function (path) {
      const d = path.match(/\bd\s*=\s*['"]([^'"]+)['"]/i);
      if (!d) return;
      const commandsUsed = d[1].match(/[a-zA-Z]/g) || [];
      if (commandsUsed.some(function (command) { return command !== "M" && command !== "L" && command !== "Z"; })) return;
      const transform = path.match(/\btransform\s*=\s*['"]([^'"]+)['"]/i);
      const translate = transform && transform[1].match(/translate\(\s*([-\d.]+)/i);
      const mirror = transform && /scale\(\s*-\s*1(?:\s|,|\))/i.test(transform[1]);
      const commands = d[1].matchAll(/([MLZ])(?:\s*([-\d.]+)[,\s]+([-\d.]+))?/g);
      let point = null, first = null;
      for (const command of commands) {
        let next;
        if (command[1] === "Z") {
          next = first;
          if (!next) continue;
        } else {
          if (command[2] === undefined || command[3] === undefined) continue;
          let x = Number(command[2]), y = Number(command[3]);
          if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
          if (mirror) x = (translate ? Number(translate[1]) : 0) - x;
          next = { x: (x - minX) * size.width / viewWidth, y: (y - minY) * size.height / viewHeight };
        }
        if (command[1] !== "M" && point) {
          const dx = Math.abs(next.x - point.x), dy = Math.abs(next.y - point.y);
          const length = Math.hypot(dx, dy);
          if (length >= .08 && (dx < .01 || dy < .01)) {
            lines.push({ x1: point.x, y1: point.y, x2: next.x, y2: next.y, halfWidth: halfWidth });
          }
        }
        point = next;
        if (command[1] === "M") first = next;
      }
    });
    return lines;
  }

  function clearSvgBase(showStatus) {
    if (svgUrl) URL.revokeObjectURL(svgUrl);
    svgUrl = null;
    window.__svgSnapLines = [];
    choosingOrigin = false;
    originButton.disabled = true;
    originButton.textContent = "设置网格原点";
    window.__gridOrigin = { x: 0, y: 0 };
    canvas.classList.remove("svg-active");
    if (window.__resetCanvasSize) window.__resetCanvasSize();
    const floorplan = canvas.querySelector(".floorplan");
    if (floorplan) floorplan.remove();
    canvas.style.width = sampleCanvasSize.width;
    canvas.style.height = sampleCanvasSize.height;
    ensureGrid();
    clearButton.disabled = true;
    if (showStatus) status.textContent = "已清除 SVG 底图，恢复示例基底";
  }

  function importSvg(file, size, text) {
    clearSvgBase(false);
    svgUrl = URL.createObjectURL(file);
    window.__svgSnapLines = wallLinesFromSvg(text, size);
    const floorplan = document.createElement("img");
    floorplan.className = "floorplan";
    floorplan.alt = "导入的 SVG 平面图（锁定底图）";
    floorplan.src = svgUrl;
    floorplan.style.zIndex = "3";
    if (size) {
      if (window.__setSvgCanvasSize) window.__setSvgCanvasSize(size.width, size.height);
      else {
        canvas.style.width = (size.width * 100) + "px";
        canvas.style.height = (size.height * 100) + "px";
      }
      floorplan.style.objectFit = "fill";
    }
    floorplan.onerror = function () {
      clearSvgBase(false);
      status.textContent = "SVG 无法显示，请确认文件内容完整";
    };
    canvas.insertBefore(floorplan, ensureGrid());
    canvas.classList.add("svg-active");
    clearButton.disabled = false;
    originButton.disabled = false;
    const knownOrigin = knownPlanOrigin(text, size);
    if (knownOrigin) setGridOrigin(knownOrigin);
    status.textContent = size
      ? "已按 SVG 的 " + size.width.toFixed(2) + "m × " + size.height.toFixed(2) + "m 尺寸校准；每小格为 0.25m" + (knownOrigin ? "，网格原点已对准门边墙角" : "；可设置网格原点")
      : "已导入 SVG 平面图；它已锁定在网格下方，仍可拖拽厨具";
  }

  function looksLikeSvg(text) {
    return /^\s*(?:<\?xml[\s\S]*?\?>\s*)?(?:<!--[\s\S]*?-->\s*)*<svg\b/i.test(text);
  }

  fileInput.onchange = function (event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      const text = String(reader.result || "");
      const saysSvg = /\.svg$/i.test(file.name) || file.type === "image/svg+xml";
      if (saysSvg || looksLikeSvg(text)) {
        if (looksLikeSvg(text)) importSvg(file, sizeFromSvg(text), text);
        else status.textContent = "SVG 文件格式无效";
      } else {
        jsonImport({ target: fileInput });
      }
      fileInput.value = "";
    };
    reader.readAsText(file);
  };
  clearButton.onclick = function () { clearSvgBase(true); };
  originButton.onclick = function () {
    choosingOrigin = !choosingOrigin;
    originButton.textContent = choosingOrigin ? "取消设置原点" : "设置网格原点";
    status.textContent = choosingOrigin ? "请点击图纸上的墙角，网格会对准最近的墙线端点" : "已取消设置网格原点";
  };
  canvas.addEventListener("pointerdown", function (event) {
    if (!choosingOrigin) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    const rect = canvas.getBoundingClientRect();
    const point = { x: (event.clientX - rect.left) / 100, y: (event.clientY - rect.top) / 100 };
    let closest = null, distance = .25;
    (window.__svgSnapLines || []).forEach(function (line) {
      [{ x: line.x1, y: line.y1 }, { x: line.x2, y: line.y2 }].forEach(function (candidate) {
        const d = Math.hypot(candidate.x - point.x, candidate.y - point.y);
        if (d < distance) { closest = candidate; distance = d; }
      });
    });
    setGridOrigin(closest || point);
    choosingOrigin = false;
    originButton.textContent = "设置网格原点";
    status.textContent = closest ? "网格原点已对准墙线端点" : "网格原点已设在点击位置";
  }, true);
});
</script>

function snapToSvgWalls(left,top,width,height){
