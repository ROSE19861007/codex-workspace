<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>餐饮厨房空间编辑器</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#dce3ed;--blue:#2563eb;--bg:#f4f6f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Arial,"Microsoft YaHei",sans-serif;color:var(--ink)}header{height:58px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}header b{font-size:18px}.app{min-height:calc(100vh - 58px);display:grid;grid-template-columns:370px 1fr;gap:16px;padding:16px}.panel{background:#fff;border:1px solid #e1e7ef;border-radius:10px;padding:16px;overflow:auto}.section{border-bottom:1px solid #e8edf3;padding-bottom:15px;margin-bottom:15px}h2{font-size:14px;margin:0 0 8px}.note,#status{font-size:12px;color:var(--muted);margin:0 0 9px}textarea{width:100%;height:150px;padding:9px;border:1px solid #d4dce8;border-radius:7px;background:#fbfcfe;font:11px/1.4 Consolas,monospace;resize:vertical}button{border:0;border-radius:6px;background:var(--blue);color:#fff;padding:8px 10px;font-weight:bold;cursor:pointer;margin:8px 5px 0 0}.muted{background:#e9eef5;color:#334155}.danger{background:#fee2e2;color:#b91c1c}.top{display:flex;justify-content:space-between;gap:8px;align-items:start;margin-bottom:14px}.canvasbox{height:calc(100vh - 158px);min-height:500px;overflow:auto;background:#edf1f6;padding:28px;border:1px solid var(--line);border-radius:9px}.canvas{position:relative;margin:auto;background-color:#fff;background-image:linear-gradient(#e5e7eb 1px,transparent 1px),linear-gradient(90deg,#e5e7eb 1px,transparent 1px);box-shadow:0 3px 12px #0002}.base{position:absolute;pointer-events:none;z-index:1}.wall{background:#3b4657}.wall.half{background:repeating-linear-gradient(135deg,#8b5e3c 0 5px,#b9855f 5px 10px)}.door{background:#fff;border:2px solid #a16207}.window{background:#bae6fd;border:2px solid #0284c7}.utility{position:absolute;z-index:2;pointer-events:none;width:16px;height:16px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:bold}.palette{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:9px;min-height:68px;border:1px solid #d8e0ec;border-left:5px solid var(--c);border-radius:7px;cursor:grab;font-weight:bold}.item small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.device{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;border:2px solid #fff;border-radius:5px;box-shadow:0 2px 5px #0004;cursor:move;font-size:12px;font-weight:bold;padding:3px;user-select:none;z-index:5}.device small{display:block;font-size:10px;font-weight:normal}.selected{outline:3px solid #f59e0b;outline-offset:2px}.checks{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfe;max-height:150px;overflow:auto;font-size:12px}.checks p{margin:0 0 5px}.ok{color:#15803d}.warn{color:#b45309}.bad{color:#dc2626}.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--muted);margin-top:9px}.legend i{width:12px;height:12px;display:inline-block;vertical-align:-2px;margin-right:3px;background:#3b4657}.legend i.half{background:repeating-linear-gradient(135deg,#8b5e3c 0 3px,#b9855f 3px 6px)}@media(max-width:850px){.app{grid-template-columns:1fr}.canvasbox{height:600px}}</style></head>
<body><header><b>餐饮厨房空间编辑器</b><span>单位：米 · 基底受约束 · 网格：1 米</span></header>
<main class="app"><aside class="panel">
<div class="section"><h2>基底 baseJson</h2><p class="note">基底锁定。墙体支持承重/非承重、全墙/半墙与允许拆改标记；接口用于设备校验。</p><textarea id="baseText">{
  "width":10,"height":7,"wallThickness":0.2,
  "elements":[
    {"type":"wall","x":0,"y":0,"width":10,"height":0.2,"structure":"bearing","form":"full","demolitionAllowed":false},
    {"type":"wall","x":0,"y":6.8,"width":10,"height":0.2,"structure":"bearing","form":"full","demolitionAllowed":false},
    {"type":"wall","x":0,"y":0,"width":0.2,"height":7,"structure":"bearing","form":"full","demolitionAllowed":false},
    {"type":"wall","x":9.8,"y":0,"width":0.2,"height":7,"structure":"bearing","form":"full","demolitionAllowed":false},
    {"type":"wall","x":3.4,"y":1.2,"width":0.2,"height":2.4,"structure":"nonBearing","form":"half","heightMeters":1.2,"demolitionAllowed":true},
    {"type":"door","x":4.1,"y":6.78,"width":1.2,"height":0.22},
    {"type":"window","x":9.78,"y":1.6,"width":0.22,"height":1.5}
  ],
  "utilityPoints":[
    {"type":"power","x":1,"y":1},{"type":"water","x":1,"y":5.8},
    {"type":"drain","x":1.2,"y":5.8},{"type":"gas","x":7.8,"y":1},
    {"type":"exhaust","x":7.8,"y":0.5}
  ]
}</textarea><button class="muted" id="baseApply">应用基底 JSON</button></div>
<div class="section"><h2>厨具 components JSON</h2><p class="note">设备尺寸固定；可定义需水、电、燃气、排烟及前方操作净距。</p><textarea id="compText">[
 {"id":"bench","name":"不锈钢操作台","width":1.8,"height":0.7,"color":"#475569","clearance":{"front":1},"needs":[]},
 {"id":"sink","name":"双槽水池","width":1.2,"height":0.7,"color":"#0f766e","clearance":{"front":1},"needs":["water","drain","power"]},
 {"id":"fridge","name":"立式冷藏柜","width":1,"height":0.8,"color":"#2563eb","clearance":{"front":1.2},"needs":["power"]},
 {"id":"stove","name":"四头燃气炉","width":1.2,"height":0.8,"color":"#dc2626","clearance":{"front":1.2},"needs":["gas","exhaust"]},
 {"id":"fryer","name":"双缸油炸炉","width":0.9,"height":0.8,"color":"#c2410c","clearance":{"front":1.2},"needs":["power","exhaust"]},
 {"id":"oven","name":"蒸烤箱","width":1.2,"height":0.9,"color":"#7c3aed","clearance":{"front":1.3},"needs":["power","water","drain"]}
]</textarea><button class="muted" id="compApply">应用厨具 JSON</button></div>
<h2>可拖拽设备</h2><div class="palette" id="palette"></div></aside>
<section class="panel"><div class="top"><div><h2 style="font-size:17px">厨房布局画布</h2><p id="status">拖拽左侧设备至画布；基底不可编辑</p></div><div><button class="danger" id="delete">删除选中</button><button class="muted" id="check">校验布局</button><button id="export">导出布局 JSON</button><button id="import">导入布局 JSON</button></div></div><div class="canvasbox"><div class="canvas" id="canvas"></div></div><div class="legend"><span><i></i>承重/全墙</span><span><i class="half"></i>非承重半墙（可拆）</span><span>● 水/电/燃气/排烟接口</span></div><div class="checks" id="checks"><p>点击“校验布局”检查越界、碰撞、门窗占用及接口需求。</p></div></section></main>
<script>
(()=>{const S=60,$=x=>document.getElementById(x),canvas=$("canvas");let base,comps,layout={version:2,placements:[]},selected=null,drag=null;const component=id=>comps.find(c=>c.id===id),say=(m,b=false)=>{$("status").textContent=m;$("status").style.color=b?"#dc2626":"#667085"},parse=(x,n)=>{try{return JSON.parse(x)}catch(e){throw Error(n+" 格式错误")}},snap=n=>Math.max(0,Math.round(n)),rect=(x,y,w,h)=>({x,y,w,h}),hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function renderPalette(){let p=$("palette");p.innerHTML="";comps.forEach(c=>{let d=document.createElement("div");d.className="item";d.draggable=true;d.style.setProperty("--c",c.color||"#2563eb");d.innerHTML=c.name+"<small>"+c.width+"m × "+c.height+"m"+(c.needs?.length?" · "+c.needs.join("/"): "")+"</small>";d.ondragstart=e=>e.dataTransfer.setData("component",c.id);p.append(d)})}
function render(){canvas.innerHTML="";canvas.style.width=base.width*S+"px";canvas.style.height=base.height*S+"px";canvas.style.backgroundSize=S+"px "+S+"px";base.elements.forEach(e=>{let d=document.createElement("div");d.className="base "+e.type+(e.form==="half"?" half":"");d.title=e.type==="wall"?(e.structure==="bearing"?"承重墙":"非承重墙")+" · "+(e.form==="half"?"半墙":"全墙")+(e.demolitionAllowed?" · 可拆改":" · 不可拆改"):"锁定"+e.type;d.style.cssText="left:"+e.x*S+"px;top:"+e.y*S+"px;width:"+e.width*S+"px;height:"+e.height*S+"px";canvas.append(d)});(base.utilityPoints||[]).forEach(u=>{let d=document.createElement("div");d.className="utility";d.textContent={power:"电",water:"水",drain:"排",gas:"气",exhaust:"烟"}[u.type]||"●";d.title=u.type+" 接口";d.style.cssText+="left:"+u.x*S+"px;top:"+u.y*S+"px;background:"+({power:"#7c3aed",water:"#0284c7",drain:"#0f766e",gas:"#dc2626",exhaust:"#475569"}[u.type]||"#334155");canvas.append(d)});layout.placements.forEach(p=>{let c=component(p.componentId);if(!c)return;let d=document.createElement("div");d.className="device "+(selected===p.instanceId?"selected":"");d.style.cssText="left:"+p.x*S+"px;top:"+p.y*S+"px;width:"+c.width*S+"px;height:"+c.height*S+"px;background:"+c.color;d.innerHTML="<div>"+c.name+"<small>"+c.width+"m × "+c.height+"m</small></div>";d.onpointerdown=e=>start(e,p,c);canvas.append(d)})}
function clamp(e,c,ox=0,oy=0){let r=canvas.getBoundingClientRect(),x=snap((e.clientX-r.left-ox)/S),y=snap((e.clientY-r.top-oy)/S);return{x:Math.min(x,Math.floor(base.width-c.width)),y:Math.min(y,Math.floor(base.height-c.height))}}
function start(e,p,c){e.preventDefault();let r=canvas.getBoundingClientRect();selected=p.instanceId;drag={p,c,ox:e.clientX-r.left-p.x*S,oy:e.clientY-r.top-p.y*S};render()}
function validate(){let out=[],placed=layout.placements.map(p=>({...p,c:component(p.componentId)}));placed.forEach((p,i)=>{if(!p.c)return;let a=rect(p.x,p.y,p.c.width,p.c.height),label=p.c.name; if(p.x<0||p.y<0||p.x+p.c.width>base.width||p.y+p.c.height>base.height)out.push(["bad",label+"：超出可用平面"]);base.elements.filter(e=>["wall","door","window"].includes(e.type)).forEach(e=>{if(hit(a,rect(e.x,e.y,e.width,e.height)))out.push(["bad",label+"：与"+(e.type==="wall"?"墙体":e.type==="door"?"门":"窗")+"重叠"])});placed.slice(i+1).forEach(q=>{if(q.c&&hit(a,rect(q.x,q.y,q.c.width,q.c.height)))out.push(["bad",label+" 与 "+q.c.name+" 重叠"])});(p.c.needs||[]).forEach(n=>{let pts=(base.utilityPoints||[]).filter(u=>u.type===n),cx=p.x+p.c.width/2,cy=p.y+p.c.height/2,near=pts.some(u=>Math.hypot(u.x-cx,u.y-cy)<=3);if(!pts.length)out.push(["warn",label+"：未定义 "+n+" 接口"]);else if(!near)out.push(["warn",label+"："+n+" 接口距离超过 3m，请复核"]);});let front=p.c.clearance?.front;if(front&&p.y+ p.c.height+front>base.height)out.push(["warn",label+"：前方操作净距 "+front+"m 不足"]);});let box=$("checks");box.innerHTML=out.length?out.map(x=>"<p class='"+x[0]+"'>● "+x[1]+"</p>").join(""):"<p class='ok'>✓ 未发现越界、重叠、门窗碰撞或缺失接口。仍请按现场消防、排烟与施工条件复核。</p>";say(out.length?"校验完成：发现 "+out.length+" 项需处理":"校验通过");}
canvas.ondragover=e=>e.preventDefault();canvas.ondrop=e=>{e.preventDefault();let c=component(e.dataTransfer.getData("component"));if(!c)return;let p=clamp(e,c,c.width*S/2,c.height*S/2),id="item_"+Date.now();layout.placements.push({instanceId:id,componentId:c.id,x:p.x,y:p.y});selected=id;render();say("已添加 "+c.name)};
window.onpointermove=e=>{if(!drag)return;let v=clamp(e,drag.c,drag.ox,drag.oy);drag.p.x=v.x;drag.p.y=v.y;render()};window.onpointerup=()=>{if(drag)say("设备已吸附至网格");drag=null};canvas.onpointerdown=e=>{if(e.target===canvas){selected=null;render()}};
$("baseApply").onclick=()=>{try{let v=parse($("baseText").value,"baseJson");if(!v.width||!v.height||!Array.isArray(v.elements))throw Error("baseJson 需含 width、height、elements");base=v;render();say("基底已更新")}catch(e){say(e.message,true)}};
$("compApply").onclick=()=>{try{let v=parse($("compText").value,"components JSON");if(!Array.isArray(v)||!v.every(c=>c.id&&c.name&&c.width>0&&c.height>0))throw Error("设备字段不完整");comps=v;layout.placements=layout.placements.filter(p=>component(p.componentId));renderPalette();render();say("厨具面板已更新")}catch(e){say(e.message,true)}};
$("delete").onclick=()=>{if(!selected)return say("请先选择设备",true);layout.placements=layout.placements.filter(p=>p.instanceId!==selected);selected=null;render();say("已删除设备")};$("check").onclick=validate;
$("export").onclick=async()=>{let t=JSON.stringify(layout,null,2);try{await navigator.clipboard.writeText(t);say("布局 JSON 已复制")}catch(e){prompt("复制布局 JSON：",t)}};
$("import").onclick=()=>{let t=prompt("粘贴 layoutJson：");if(!t)return;try{let v=parse(t,"layoutJson"),a=Array.isArray(v)?v:v.placements;if(!Array.isArray(a))throw Error("需含 placements 数组");layout={version:2,placements:a.filter(p=>component(p.componentId)).map((p,i)=>({instanceId:p.instanceId||"import_"+i,componentId:p.componentId,x:snap(p.x),y:snap(p.y)}))};selected=null;render();say("布局已恢复")}catch(e){say(e.message,true)}};
base=parse($("baseText").value,"baseJson");comps=parse($("compText").value,"components JSON");renderPalette();render()})();
</script></body></html>
